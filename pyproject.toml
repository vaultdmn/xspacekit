[project]
name = "xspacekit"
version = "0.1.0"
description = "Unofficial Python SDK and CLI for X Spaces audio (WebRTC Janus signaling, HLS, and reverse-engineered Periscope auth)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["x-spaces", "twitter-spaces", "webrtc", "janus", "hls", "periscope", "reverse-engineering", "sdk"]
authors = [
    { name = "xspacekit contributors" }
]
dependencies = [
    "httpx>=0.27,<1",
    "aiortc>=1.5.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-anyio>=4.0.0",
    "ruff>=0.3.0",
]

[project.scripts]
xspacekit = "xspacekit.cli.main:main"

[project.urls]
Homepage = "https://github.com/xspacekit/xspacekit"
Documentation = "https://docs.xspacekit.dev"
Repository = "https://github.com/xspacekit/xspacekit"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["xspacekit*"]

[tool.ruff]
line-length = 100
exclude = ["_tmp_scripts", "captures", ".venv", "src/xspacekit.egg-info"]

[tool.pytest.ini_options]
testpaths = ["src/xspacekit/tests"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
